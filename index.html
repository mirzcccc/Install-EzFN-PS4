<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Remote PKG Installer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121622;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #1c2333;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2b364f;
        }
        h1 {
            color: #0070d1;
            margin-bottom: 10px;
        }
        p {
            color: #a0aec0;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid #2b364f;
            background-color: #0f131a;
            color: #ffffff;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0070d1;
            outline: none;
        }
        .btn-install {
            width: 100%;
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-install:hover {
            background-color: #0056a3;
        }
        .btn-install:active {
            transform: scale(0.98);
        }
        .quick-section {
            margin-top: 20px;
            padding: 20px;
            background-color: #171e2c;
            border-radius: 8px;
            border: 1px dashed #3b4a6b;
            text-align: left;
        }
        .btn-quick {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }
        .btn-quick:hover {
            background-color: #2b5c8f;
        }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
        .info-note {
            margin-top: 30px;
            font-size: 13px;
            color: #718096;
            line-height: 1.5;
            text-align: center;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Browser Installer</h1>
        <p>Trigger .pkg installations directly from your PlayStation 4 web browser.</p>
        
        <!-- Custom URL Input (Tvoj link je unesen kao podrazumijevani (default) tekst) -->
        <div class="form-group">
            <label for="pkg-url">Direct PKG URL:</label>
            <input type="text" id="pkg-url" value="https://ps.repressoh.it/ps4/EZFN_1261.pkg" placeholder="https://example.com" autocomplete="off">
        </div>

        <button class="btn-install" onclick="startDirectInstall(document.getElementById('pkg-url').value)">Trigger Custom URL</button>

        <!-- Quick Install sekcija sa predefinisanim aplikacijama -->
        <div class="quick-section clearfix">
            <span style="font-weight: bold; color: #e2e8f0; line-height: 35px;">EZFN 1261 Installer</span>
            <button class="btn-quick" onclick="startDirectInstall('https://ps.repressoh.it/ps4/EZFN_1261.pkg')">Quick Install</button>
        </div>

        <div id="status-message" class="status-box"></div>

        <div class="info-note">
            <strong>Requirements:</strong> Your PS4 must be jailbroken with GoldHEN running. Make sure the <strong>Remote Package Installer (RPI)</strong> setting is enabled inside the GoldHEN menu before clicking install.
        </div>
    </div>

    <script>
        function startDirectInstall(pkgUrlInput) {
            const statusBox = document.getElementById('status-message');
            pkgUrlInput = pkgUrlInput.trim();
            
            if (!pkgUrlInput) {
                statusBox.style.display = "block";
                statusBox.style.backgroundColor = "#742a2a";
                statusBox.style.color = "#fed7d7";
                statusBox.innerText = "Error: Please enter a valid URL first.";
                return;
            }

            statusBox.style.display = "block";
            statusBox.style.backgroundColor = "#2c5282";
            statusBox.style.color = "#ebf8ff";
            statusBox.innerText = "Sending command to your PS4 system...";

            // GoldHEN RPI API endpoint
            const rpiEndpoint = "http://127.0.0";

            const payload = {
                type: "direct",
                url: pkgUrlInput
            };

            fetch(rpiEndpoint, {
                method: "POST",
                body: JSON.stringify(payload),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if (response.ok) {
                    statusBox.style.backgroundColor = "#22543d";
                    statusBox.style.color = "#c6f6d5";
                    statusBox.innerText = "Success! Check 'Downloads' in your PS4 notifications menu.";
                } else {
                    statusBox.style.backgroundColor = "#742a2a";
                    statusBox.style.color = "#fed7d7";
                    statusBox.innerText = "Failed: Console rejected the request. Is GoldHEN API ready?";
                }
            })
            .catch(error => {
                statusBox.style.backgroundColor = "#742a2a";
                statusBox.style.color = "#fed7d7";
                statusBox.innerText = "Connection error. Make sure Remote Package Installer is turned ON in GoldHEN settings.";
                console.error("Debug info:", error);
            });
        }
    </script>

</body>
</html>
